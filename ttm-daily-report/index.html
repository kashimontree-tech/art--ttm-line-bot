function vals(id){return [...$(id).querySelectorAll('.it')].map(x=>x.value.trim()).filter(Boolean)}function sups(){return [...$('sup').querySelectorAll('.row')].map(r=>({n:r.querySelector('.sn').value.trim(),p:r.querySelector('.sp').value.trim()})).filter(x=>x.n||x.p)}
function txt(){let s=sups(),a=vals('today'),b=vals('tomorrow');return '✍️รายงานประจำวันที่: '+$('date').value+'\n\n🏬โครงการ: '+($('project').value||'-')+'\n🏢ห้าง: '+($('mall').value||'-')+'\n📍สาขา: '+($('branch').value||'-')+'\n⏰เวลา: '+$('start').value+'–'+$('end').value+'\n👷จำนวนคน: '+$('workers').value+' คน\n\n🚧งานวันนี้\n'+(a.length?a.map(x=>'– '+x).join('\n'):'-')+'\n\n📝งานพรุ่งนี้\n'+(b.length?b.map(x=>'– '+x).join('\n'):'-')+'\n\n📈ความคืบหน้า: '+$('progress').value+'%\n‼️ปัญหา: '+($('problems').value||'-')+'\nผู้รายงาน: '+($('reporter').value||'คุณ แอ๋ม')}
async function addPics(fs){for(const f of [...fs]){if(pics.length>=12)break;pics.push(f)}draw()}function draw(){$('photos').innerHTML='';pics.forEach((f,i)=>{let d=document.createElement('div');d.className='ph';let im=document.createElement('img');im.src=URL.createObjectURL(f);let b=document.createElement('button');b.textContent='×';b.onclick=()=>{pics.splice(i,1);draw()};d.append(im,b);$('photos').appendChild(d)})}
function wrap(c,t,w){let a=String(t||'-').split(/\s+/),r=[],l='';for(const x of a){let q=l?l+' '+x:x;if(c.measureText(q).width>w&&l){r.push(l);l=x}else l=q}if(l)r.push(l);return r}
const load=u=>new Promise((r,j)=>{let i=new Image;i.onload=()=>r(i);i.onerror=j;i.src=u});
async function canvas(){let c=$('cv'),x=c.getContext('2d'),W=1200,p=55,y=75,ww=W-110,a=vals('today'),b=vals('tomorrow'),s=sups();c.width=W;c.height=Math.max(1700,1300+(a.length+b.length+s.length)*45+Math.ceil(pics.length/2)*300);x.fillStyle='#f4f1ea';x.fillRect(0,0,c.width,c.height);x.fillStyle='#171717';x.fillRect(0,0,W,150);x.fillStyle='#fff';x.font='700 40px sans-serif';x.fillText('TTM DAILY REPORT',p,62);x.fillStyle='#e4cf88';x.font='22px sans-serif';x.fillText('HOME DESIGN & BUILD-IN CO., LTD.',p,100);y=190;
function h(t){x.fillStyle='#171717';x.font='700 28px sans-serif';x.fillText(t,p,y);y+=38}function r(k,v){x.fillStyle='#fff';x.fillRect(p,y,ww,62);x.fillStyle='#665e52';x.font='700 20px sans-serif';x.fillText(k,p+18,y+25);x.fillStyle='#171717';x.font='22px sans-serif';x.fillText(String(v||'-'),p+280,y+27);y+=72}function sec(t,arr){h(t);let z=arr.length?arr:['-'];x.fillStyle='#fff';x.fillRect(p,y,ww,Math.max(70,z.length*36+25));x.fillStyle='#171717';x.font='22px sans-serif';let yy=y+30;z.forEach((q,i)=>{wrap(x,(q.n||q)+(q.p?' '+q.p:''),ww-50).forEach((ln,j)=>{x.fillText((j===0&&q!=='-'?(i+1)+'. ':'')+ln,p+18,yy);yy+=31})});y+=Math.max(70,z.length*36+25)+18}
h('ข้อมูลรายงาน');r('วันที่',$('date').value);r('โครงการ',$('project').value);r('ห้าง',$('mall').value);r('สาขา',$('branch').value);r('เวลาทำงาน',$('start').value+'–'+$('end').value);r('จำนวนคน',$('workers').value+' คน');r('ผู้รายงาน',$('reporter').value);sec('ผู้ควบคุม',s);sec('งานที่ทำวันนี้',a);sec('งานที่ทำพรุ่งนี้',b);r('ความคืบหน้า',$('progress').value+'%');sec('ปัญหา / อุปสรรค',[$('problems').value||'-']);
if(pics.length){h('รูปหน้างาน');let gap=14,cw=(ww-gap)/2,ch=270;for(let i=0;i<pics.length;i++){let col=i%2,row=Math.floor(i/2),px=p+col*(cw+gap),py=y+row*(ch+gap),u=URL.createObjectURL(pics[i]);try{let im=await load(u),sc=Math.max(cw/im.width,ch/im.height),sw=cw/sc,sh=ch/sc;x.drawImage(im,(im.width-sw)/2,(im.height-sh)/2,sw,sh,px,py,cw,ch)}catch{}URL.revokeObjectURL(u)}}
return c}
const bcan=(c,t,q)=>new Promise(r=>c.toBlob(r,t,q));function name(ext){return 'TTM_Daily_Report_'+(($('project').value||'Project').replace(/[^A-Za-z0-9ก-๙_-]/g,'_'))+'_'+$('date').value+'.'+ext}
function pdf(j,w,h){let e=new TextEncoder(),ps=[],o=0,ofs=[],put=v=>{let b=typeof v==='string'?e.encode(v):v;ps.push(b);o+=b.length},obj=(n,b)=>{ofs[n]=o;put(n+' 0 obj\n'+b+'\nendobj\n')},pw=595.28,ph=pw*h/w;put('%PDF-1.4\n');obj(1,'<< /Type /Catalog /Pages 2 0 R >>');obj(2,'<< /Type /Pages /Kids [3 0 R] /Count 1 >>');obj(3,'<< /Type /Page /Parent 2 0 R /MediaBox [0 0 '+pw+' '+ph+'] /Resources << /XObject << /Im0 4 0 R >> >> /Contents 5 0 R >>');ofs[4]=o;put('4 0 obj\n<< /Type /XObject /Subtype /Image /Width '+w+' /Height '+h+' /ColorSpace /DeviceRGB /BitsPerComponent 8 /Filter /DCTDecode /Length '+j.length+' >>\nstream\n');put(j);put('\nendstream\nendobj\n');let st='q\n'+pw+' 0 0 '+ph+' 0 0 cm\n/Im0 Do\nQ\n';obj(5,'<< /Length '+e.encode(st).length+' >>\nstream\n'+st+'endstream');let xr=o;put('xref\n0 6\n0000000000 65535 f \n');for(let i=1;i<=5;i++)put(String(ofs[i]).padStart(10,'0')+' 00000 n \n');put('trailer\n<< /Size 6 /Root 1 0 R >>\nstartxref\n'+xr+'\n%%EOF');let n=ps.reduce((a,b)=>a+b.length,0),out=new Uint8Array(n),k=0;ps.forEach(b=>{out.set(b,k);k+=b.length});return out}
function link(label,file,blob,cls){let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.target='_blank';a.download=file.name;a.className='btn '+cls;a.textContent=label;$('links').appendChild(a)}
async function makeImg(){let c=await canvas(),bl=await bcan(c,'image/png'),f=new File([bl],name('png'),{type:'image/png'});lastImg=f;link('🖼️ เปิดรูปสรุป 1 รูป',f,bl,'gold');$('status').textContent='✅ สร้างรูปสรุปแล้ว';return f}
async function makePdf(){let c=await canvas(),jb=await bcan(c,'image/jpeg',.9),j=new Uint8Array(await jb.arrayBuffer()),bl=new Blob([pdf(j,c.width,c.height)],{type:'application/pdf'}),f=new File([bl],name('pdf'),{type:'application/pdf'});lastPdf=f;link('📄 เปิด PDF พร้อมรูป',f,bl,'dark');$('status').textContent='✅ สร้าง PDF พร้อมรูปแล้ว';return f}
async function both(){let p=lastPdf||await makePdf(),i=lastImg||await makeImg();if(navigator.share&&(!navigator.canShare||navigator.canShare({files:[p,i]})))await navigator.share({title:'TTM Daily Report',text:txt(),files:[p,i]});else $('status').textContent='สร้างไฟล์แล้ว กดเปิดไฟล์แล้ว Share จาก iPhone/iPad'}
function line(){location.href='https://line.me/R/msg/text/?'+encodeURIComponent(txt())}
document.addEventListener('DOMContentLoaded',()=>{let d=new Date(),l=new Date(d-d.getTimezoneOffset()*60000);$('date').value=l.toISOString().slice(0,10);addSup();addSup();addTask('today','งานที่ทำวันนี้');addTask('today','งานที่ทำวันนี้');addTask('today','งานที่ทำวันนี้');addTask('tomorrow','งานที่ทำพรุ่งนี้');addTask('tomorrow','งานที่ทำพรุ่งนี้');addTask('tomorrow','งานที่ทำพรุ่งนี้');$('addSup').onclick=addSup;$('addToday').onclick=()=>addTask('today','งานที่ทำวันนี้');$('addTomorrow').onclick=()=>addTask('tomorrow','งานที่ทำพรุ่งนี้');$('cam').onchange=e=>addPics(e.target.files);$('gal').onchange=e=>addPics(e.target.files);$('progress').oninput=()=>$('pct').textContent=$('progress').value+'%';$('pdfBtn').onclick=makePdf;$('imgBtn').onclick=makeImg;$('bothBtn').onclick=both;$('lineBtn').onclick=line;$('shareBtn').onclick=line;$('saveBtn').onclick=()=>{localStorage.setItem('ttmDailyDraft',txt());$('status').textContent='✅ บันทึกแล้ว'}})
