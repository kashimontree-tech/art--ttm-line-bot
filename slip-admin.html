<!doctype html><html lang="th"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>TTM | จัดการอัลบั้มสลิป</title><style>
:root{font-family:system-ui,"Noto Sans Thai",sans-serif;color:#182d28;background:#f3f7f4}*{box-sizing:border-box}body{margin:0}header{background:#12583c;color:white;padding:19px 22px}header h1{margin:0;font-size:22px}header p{margin:5px 0 0;opacity:.85}main{max-width:1120px;margin:auto;padding:18px}section{background:white;border:1px solid #dce9e2;border-radius:15px;padding:16px;margin-bottom:14px}button,input,select{font:inherit;border-radius:9px;border:1px solid #bfcec6;padding:10px}button{background:#12583c;color:white;border:0;cursor:pointer}button.secondary{background:#e6f1eb;color:#12583c}button:disabled{opacity:.4}.toolbar{display:flex;flex-wrap:wrap;align-items:end;gap:12px}.toolbar label{flex:1;min-width:200px}label{display:flex;flex-direction:column;gap:5px;font-weight:600;font-size:14px}input,select{width:100%;background:white;color:#213e32}.summary{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}.stat{background:#eaf4ee;padding:14px;border-radius:12px}.stat strong{display:block;font-size:24px}.items{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px}.item{background:white;border:1px solid #dce9e2;border-radius:14px;overflow:hidden}.item img{width:100%;height:210px;object-fit:contain;background:#e5ede7}.fields{padding:14px;display:grid;gap:10px}.save{width:100%}.muted{color:#687b70;font-size:13px}.danger{color:#a12d26}.message{padding:12px;border-radius:8px;background:#fff3d7;margin-top:10px}.row{display:flex;gap:8px}.row>*{flex:1}@media(max-width:600px){.summary{grid-template-columns:1fr 1fr}main{padding:10px}header{padding:16px}} </style></head><body>
<header><h1>TTM • อัลบั้มสลิป</h1><p>ตรวจสอบ • แก้ไข • แยกสลิปซ้ำ • ส่งออก PDF / Excel</p></header><main>
<section><div class="toolbar"><label>รหัสผู้ดูแล<input id="pin" type="password" placeholder="ใส่รหัสผู้ดูแลระบบ" autocomplete="off"></label><label>ค้นหาโครงการ<input id="search" placeholder="เช่น ครัวกลางซันไม / เจมาร์ทพังงา"></label><label>อัลบั้ม<select id="album"><option value="">ทั้งหมด</option></select></label><button id="refresh">โหลดข้อมูล</button><label>สร้างชื่อโครงการใหม่<input id="newProject" placeholder="ชื่อโครงการใหม่"></label><button id="createProject">เพิ่มโครงการ</button></div><div class="toolbar"><label>เพิ่มรูปเข้ารายการของโครงการที่เลือก<input type="file" id="uploadFile" accept="image/jpeg,image/png"></label><button id="uploadBtn">อัปโหลดรูปใหม่</button></div><div id="msg" role="status"></div></section>
<div class="summary"><div class="stat">จำนวนรูป<strong id="count">–</strong></div><div class="stat">ยอดยืนยันแล้ว<strong id="total">–</strong></div><div class="stat">รอตรวจ / ซ้ำ / ตัดออก<strong id="pending">–</strong></div></div>
<section><div class="toolbar"><button id="pdf" class="secondary">ดาวน์โหลด PDF</button><button id="xlsx" class="secondary">ดาวน์โหลด Excel</button><span class="muted">ยอดรวมไม่นับรายการซ้ำ รายการตัดออก หรือรายการที่ยังไม่ยืนยัน</span></div></section>
<div id="items" class="items"></div></main>
<script>
const $=id=>document.getElementById(id);let items=[];let pin="";let createdProjects=[];try{createdProjects=JSON.parse(localStorage.getItem("ttm_projects")||"[]")}catch{}
const message=(s,error=false)=>{$("msg").className=error?"message danger":"message";$("msg").textContent=s};
async function api(path,opts={}){const r=await fetch(path,{...opts,headers:{"x-admin-pin":pin,...opts.headers}});if(!r.ok){let e;try{e=await r.json()}catch{}throw Error(e?.error||("HTTP "+r.status))}return r}
function node(type,attr={},text){const x=document.createElement(type);for(const [k,v] of Object.entries(attr)){if(k==="class")x.className=v;else x.setAttribute(k,v)}if(text!==undefined)x.textContent=text;return x}
function field(box,label,value,type="text"){const l=node("label",{},label),e=node("input",{type});e.value=value??"";l.append(e);box.append(l);return e}
async function load(){pin=$("pin").value.trim()||sessionStorage.getItem("ttm_pin")||"";if(!pin)return message("กรอกรหัสเฉพาะครั้งแรกของแท็บนี้เพื่อคุ้มครองข้อมูลสลิป",true);sessionStorage.setItem("ttm_pin",pin);try{const r=await api("/api/slip-admin/albums");const d=await r.json();let projects=[];try{projects=(await (await api("/api/slip-admin/projects")).json()).projects||[]}catch(e){console.warn(e)}const previous=$("album").value;$("album").replaceChildren(node("option",{value:""},"ทั้งหมด"));for(const a of [...new Set([...d.albums,...projects,...createdProjects])])$("album").append(node("option",{value:a},a));$("album").value=previous;items=d.items;render();message("โหลดข้อมูลสำเร็จ")}catch(e){message(e.message,true)}}
function render(){const chosen=$("album").value,shown=items.filter(x=>!chosen||x.album===chosen);$("count").textContent=shown.length;$("total").textContent=shown.filter(x=>x.status==="verified"&&Number.isFinite(x.amount)).reduce((s,x)=>s+x.amount,0).toLocaleString("th-TH",{minimumFractionDigits:2})+" ฿";$("pending").textContent=shown.filter(x=>x.status!=="verified").length;$("items").replaceChildren();
for(const x of shown){const card=node("article",{class:"item"});if(x.url){const a=node("a",{href:x.url,target:"_blank",rel:"noopener"});a.append(node("img",{src:x.url,alt:"รูปสลิป"}));card.append(a)}const b=node("div",{class:"fields"});b.append(node("div",{class:"muted"},x.name));const album=field(b,"ชื่ออัลบั้ม",x.album==="ยังไม่จัดอัลบั้ม"?"":x.album);const amount=field(b,"ยอดโอน (บาท)",x.amount,"number");amount.min="0";amount.step=".01";const reference=field(b,"เลขอ้างอิงสลิป",x.reference);const date=field(b,"วันที่โอน",x.date);const l=node("label",{},"สถานะ"),status=node("select");for(const [k,v] of [["pending","รอตรวจสอบ"],["verified","ยืนยันยอด"],["duplicate","สลิปซ้ำ (ไม่นับ)"],["excluded","ตัดออก (กู้คืนได้)"]])status.append(node("option",{value:k},v));status.value=x.status;l.append(status);b.append(l);const save=node("button",{class:"save"},"บันทึกการแก้ไข");save.onclick=async()=>{save.disabled=true;try{await api("/api/slip-admin/items/"+encodeURIComponent(x.id),{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({album:album.value,amount:amount.value,reference:reference.value,date:date.value,status:status.value})});message("บันทึก "+x.name+" แล้ว");await load()}catch(e){message(e.message,true)}finally{save.disabled=false}};b.append(save);card.append(b);$("items").append(card)}
}
$("refresh").onclick=load;$("album").onchange=render;$("search").oninput=()=>{const q=$("search").value.trim().toLowerCase();const found=[...$("album").options].find(o=>o.value&&o.value.toLowerCase().includes(q));if(found)$("album").value=found.value;else if(!q)$("album").value="";render()};$("createProject").onclick=async()=>{const v=$("newProject").value.trim();if(!v)return message("กรุณากรอกชื่อโครงการ",true);try{await api("/api/slip-admin/projects",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name:v})});if(![...$("album").options].some(o=>o.value===v))$("album").append(node("option",{value:v},v));$("album").value=v;render();message("สร้างโครงการถาวรแล้ว เลือกรูปเพื่อย้ายเข้ามาได้ครับ")}catch(e){message(e.message,true)}};

$("uploadBtn").onclick=async()=>{
  const album=$("album").value,file=$("uploadFile").files[0];
  if(!album)return message("เลือกโครงการก่อนอัปโหลดรูป",true);
  if(!file)return message("เลือกรูปก่อนครับ",true);
  if(!["image/jpeg","image/png"].includes(file.type)||file.size>12*1024*1024)return message("รองรับ JPG/PNG ไม่เกิน 12 MB",true);
  const btn=$("uploadBtn");btn.disabled=true;message("กำลังอัปโหลดรูป...");
  try{
    const base64=await new Promise((resolve,reject)=>{const r=new FileReader();r.onload=()=>resolve(String(r.result).split(",")[1]);r.onerror=reject;r.readAsDataURL(file)});
    await api("/api/slip-admin/upload",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({album,name:file.name,mime:file.type,base64})});
    $("uploadFile").value="";await load();$("album").value=album;render();message("อัปโหลดรูปเข้าโครงการ "+album+" สำเร็จ");
  }catch(e){message("อัปโหลดไม่สำเร็จ: "+e.message,true)}finally{btn.disabled=false}
};
async function download(format){const album=$("album").value;if(!album)return message("กรุณาเลือกอัลบั้มก่อนส่งออก",true);try{const r=await api("/api/slip-admin/export?album="+encodeURIComponent(album)+"&format="+format);const blob=await r.blob();const url=URL.createObjectURL(blob);const a=node("a",{href:url,download:"TTM_"+album+"."+format});document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),20000);message("สร้างไฟล์ "+format.toUpperCase()+" สำเร็จ")}catch(e){message(e.message,true)}}
$("pdf").onclick=()=>download("pdf");$("xlsx").onclick=()=>download("xlsx");
</script></body></html>
