<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ซักเลย • กล้องร้าน</title>
<style>
body{font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;margin:0;background:#f4f7f6;color:#17392e}
.wrap{max-width:980px;margin:auto;padding:20px}.hero{background:linear-gradient(135deg,#0a8d4d,#075b33);color:white;border-radius:24px;padding:20px}
.card{background:white;border-radius:20px;padding:16px;margin-top:14px;box-shadow:0 6px 22px rgba(0,0,0,.07)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.cam{background:#fff;border:1px solid #e4ebe7;border-radius:18px;overflow:hidden}
.cam img{width:100%;aspect-ratio:16/9;object-fit:cover;background:#eef2f0}.meta{padding:12px}.ok{color:#078347;font-weight:900}.bad{color:#b42318;font-weight:900}
input,button{font-size:16px;padding:12px;border-radius:12px}input{border:1px solid #d8e1dc;width:100%}button{border:0;background:#08753f;color:#fff;font-weight:900;width:100%;margin-top:10px}
.small{font-size:12px;color:#708078}@media(max-width:720px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="wrap">
<div class="hero"><h1 style="margin:0">ซักเลย • ดูแลร้าน</h1><div>สถานะกล้องและภาพล่าสุดจากร้าน</div></div>
<div id="login" class="card">
<label><b>PIN เจ้าของร้าน</b></label>
<input id="pin" type="password" inputmode="numeric" maxlength="6" placeholder="PIN 6 หลัก"/>
<button id="go">เปิดดูกล้อง</button>
<div id="err" class="small"></div>
</div>
<div id="dash" class="card" style="display:none">
<div class="grid">
  <div class="cam"><img id="img1"/><div class="meta"><b>CAM-01</b><div id="s1"></div></div></div>
  <div class="cam"><img id="img2"/><div class="meta"><b>CAM-02</b><div id="s2"></div></div></div>
</div>
<div class="small" style="margin-top:12px">ภาพอัปเดตเมื่อระบบหน้าร้านส่ง Snapshot เข้ามา • แจ้งเตือน LINE เมื่อกล้องขาดการติดต่อเกิน 3 นาที</div>
</div>
</div>
<script>
const $=id=>document.getElementById(id);let pin='';
async function refresh(){
 const r=await fetch('/api/cameras',{headers:{'x-admin-pin':pin}});
 if(r.status===401){$('err').textContent='PIN ไม่ถูกต้อง';return}
 const d=await r.json();$('login').style.display='none';$('dash').style.display='block';
 for(const cam of d.cameras){
   const n=cam.id==='CAM-01'?'1':'2';
   $('s'+n).innerHTML=cam.online?'<span class="ok">ออนไลน์</span>':'<span class="bad">ออฟไลน์ / ยังไม่มีภาพ</span>';
   if(cam.has_image){
     fetch('/api/latest/'+cam.id+'.jpg',{headers:{'x-admin-pin':pin}})
       .then(x=>x.blob()).then(b=>{const old=$('img'+n).src;$('img'+n).src=URL.createObjectURL(b);if(old?.startsWith('blob:'))URL.revokeObjectURL(old)});
   }
 }
}
$('go').onclick=()=>{pin=$('pin').value.trim();refresh();setInterval(refresh,10000)};
</script>
</body></html>
