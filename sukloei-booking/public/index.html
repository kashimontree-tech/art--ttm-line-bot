<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>ซักเลย • จองเครื่องออนไลน์</title>
<style>
:root{--g:#08753f;--g2:#0a8d4d;--y:#ffd51f;--ink:#17392e;--muted:#6d7e77;--bg:#f5fbf8}
*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,"Noto Sans Thai",sans-serif;background:linear-gradient(180deg,#ffda22,#fff6c8 30%,#f4fbf8);color:var(--ink)}
.wrap{max-width:760px;margin:auto;padding:18px}.hero{background:linear-gradient(135deg,var(--g2),#075b33);color:#fff;border-radius:28px;padding:24px;box-shadow:0 16px 40px rgba(0,0,0,.14)}h1{margin:0;font-size:38px}.tag{font-weight:700;margin-top:8px}.pill{display:inline-block;margin-top:12px;background:var(--y);color:#704600;padding:7px 12px;border-radius:999px;font-weight:900}
.card{background:#fff;border-radius:24px;padding:20px;margin-top:16px;box-shadow:0 8px 28px rgba(0,0,0,.08)}label{display:block;font-weight:800;margin:12px 0 6px}input,select,textarea{width:100%;padding:13px 14px;border:1px solid #d9e4df;border-radius:14px;font-size:16px;background:#fff}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.machineGrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.m{border:2px solid #e2ebe7;background:#fff;border-radius:17px;padding:13px;text-align:left;color:var(--ink)}.m.sel{border-color:var(--g);background:#eaf9f1}.m b{display:block}.m small{color:var(--muted)}.slots{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.slot{padding:11px 6px;border:1px solid #dbe6e1;border-radius:12px;background:#fff}.slot.busy{opacity:.35;text-decoration:line-through}.slot.sel{background:var(--g);color:white}.primary{width:100%;border:0;border-radius:16px;padding:16px;background:var(--g);color:white;font-size:18px;font-weight:900;margin-top:16px}.primary:disabled{opacity:.45}.status{margin-top:14px;padding:14px;border-radius:14px;background:#f2f5f4;white-space:pre-wrap}.summary{background:#edf8f2;border-radius:16px;padding:14px;margin-top:12px}.small{font-size:12px;color:var(--muted)}.admin{display:block;text-align:center;margin-top:16px;color:var(--g);font-weight:800;text-decoration:none}@media(max-width:600px){.grid{grid-template-columns:1fr}.slots{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body><div class="wrap">
<div class="hero">
<h1>ซักเลย</h1><div class="tag">จองเครื่องซัก–อบออนไลน์</div>
<div class="pill">ซัก 36 นาที • อบ 40 นาที</div>
</div>

<div class="card">
<h2>1. เลือกวันที่</h2>
<input id="date" type="date"/>
<div class="small">จองล่วงหน้าได้ตามเวลาว่างของแต่ละเครื่อง</div>
</div>

<div class="card">
<h2>2. เลือกเครื่อง</h2>
<div id="machines" class="machineGrid"></div>
</div>

<div class="card">
<h2>3. เลือกเวลาเริ่ม</h2>
<div id="duration" class="summary">กรุณาเลือกเครื่องก่อน</div>
<div id="slots" class="slots" style="margin-top:12px"></div>
</div>

<div class="card">
<h2>4. ข้อมูลผู้จอง</h2>
<div class="grid">
<div><label>ชื่อ</label><input id="name" placeholder="ชื่อผู้จอง"/></div>
<div><label>เบอร์โทร</label><input id="phone" inputmode="tel" placeholder="08x-xxx-xxxx"/></div>
</div>
<label>หมายเหตุ</label><textarea id="note" rows="2" placeholder="เช่น มาถึงก่อนเวลา 5 นาที"></textarea>
<button id="book" class="primary" disabled>ยืนยันการจอง</button>
<div id="status" class="status">ยังไม่ได้เลือกเวลา</div>
</div>

<a class="admin" href="/admin">ดูตารางจองร้าน →</a>
</div>

<script>
const $=id=>document.getElementById(id);
let data=null,selectedMachine=null,selectedTime=null;
const today=new Date(); const local=new Date(today.getTime()-today.getTimezoneOffset()*60000).toISOString().slice(0,10);
$('date').value=local;$('date').min=local;

function fmtHHMM(d){return d.toLocaleTimeString('th-TH',{hour:'2-digit',minute:'2-digit',hour12:false,timeZone:'Asia/Bangkok'})}
function toMinutes(t){const [h,m]=t.split(':').map(Number);return h*60+m}
function rangesOverlap(s,e,bs,be){return s<be&&e>bs}

async function load(){
 const date=$('date').value;
 const r=await fetch('/api/availability?date='+date); data=await r.json();
 renderMachines(); if(selectedMachine){selectedMachine=data.machines.find(x=>x.machine_code===selectedMachine.machine_code)||null;renderSlots()}
}

function renderMachines(){
 $('machines').innerHTML=(data?.machines||[]).map(m=>`
 <button class="m ${selectedMachine?.machine_code===m.machine_code?'sel':''}" onclick="pickMachine('${m.machine_code}')">
 <b>${m.machine_type==='WASHER'?'🧺':'♨️'} ${m.name}</b>
 <small>${m.machine_code} • ${m.duration_minutes} นาที</small>
 </button>`).join('');
}

window.pickMachine=code=>{
 selectedMachine=data.machines.find(x=>x.machine_code===code);selectedTime=null;renderMachines();renderSlots();
 $('duration').textContent=(selectedMachine.machine_type==='WASHER'?'ซัก':'อบ')+' ใช้เวลา '+selectedMachine.duration_minutes+' นาที';
 updateBookButton();
}

function renderSlots(){
 const m=selectedMachine;if(!m){$('slots').innerHTML='';return}
 const startMin=6*60,endMin=23*60;
 const step=20; let html='';
 const now=new Date();
 for(let min=startMin;min<=endMin;min+=step){
   const h=String(Math.floor(min/60)).padStart(2,'0'),mm=String(min%60).padStart(2,'0'),t=h+':'+mm;
   const slotStart=new Date($('date').value+'T'+t+':00+07:00');
   const slotEnd=new Date(slotStart.getTime()+m.duration_minutes*60000);
   const busy=(m.bookings||[]).some(b=>rangesOverlap(slotStart.getTime(),slotEnd.getTime(),new Date(b.start_at).getTime(),new Date(b.end_at).getTime()));
   const past=slotStart.getTime()<Date.now();
   html+=`<button class="slot ${busy||past?'busy':''} ${selectedTime===t?'sel':''}" ${busy||past?'disabled':''} onclick="pickTime('${t}')">${t}</button>`;
 }
 $('slots').innerHTML=html;
}

window.pickTime=t=>{selectedTime=t;renderSlots();$('status').textContent='เลือก '+selectedMachine.name+' เวลา '+t+' น.\nใช้เวลา '+selectedMachine.duration_minutes+' นาที';updateBookButton()}

function updateBookButton(){$('book').disabled=!(selectedMachine&&selectedTime&&$('name').value.trim()&&$('phone').value.trim())}
$('name').oninput=updateBookButton;$('phone').oninput=updateBookButton;$('date').onchange=()=>{selectedTime=null;load()};

$('book').onclick=async()=>{
 $('book').disabled=true;$('status').textContent='กำลังบันทึกการจอง...';
 const r=await fetch('/api/bookings',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({
   machine_code:selectedMachine.machine_code,customer_name:$('name').value,customer_phone:$('phone').value,
   date:$('date').value,time:selectedTime,note:$('note').value
 })});
 const d=await r.json();
 if(!r.ok){$('status').textContent='❌ '+(d.error||'จองไม่สำเร็จ');await load();updateBookButton();return}
 const end=new Date(d.booking.end_at);
 $('status').textContent='✅ จองสำเร็จ\nเลขที่ '+d.booking.booking_ref+'\n'+d.machine.name+'\nเริ่ม '+selectedTime+' น. • เสร็จประมาณ '+fmtHHMM(end)+' น.';
 selectedTime=null;await load();updateBookButton();
};
load();
</script>
</body></html>
